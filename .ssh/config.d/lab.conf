# Lab machines by short name: `ssh blue-diamond` -> blue-diamond.jesseearle.com,
# resolved by Pi-hole (homelab 99-lab.conf). Works at home or on the personal VPN.
# Install: link into ~/.ssh/config.d/ and put `Include config.d/*` first in ~/.ssh/config.
Host blue-diamond cold-forge red-hawk iron-peak acer-predator
  CanonicalizeHostname yes
  CanonicalDomains jesseearle.com
  CanonicalizeMaxDots 0

Host acer-predator.jesseearle.com
  User earle

Host blue-diamond.jesseearle.com cold-forge.jesseearle.com red-hawk.jesseearle.com iron-peak.jesseearle.com acer-predator.jesseearle.com
  User jearle
  IdentityFile ~/.ssh/lab
  IdentitiesOnly yes
  StrictHostKeyChecking accept-new
  ConnectTimeout 8
