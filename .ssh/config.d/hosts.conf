# Machines by short name: `ssh blue-diamond` -> blue-diamond.hosts.jesseearle.com,
# resolved by Pi-hole (homelab pihole/dnsmasq/hosts.conf). Works at home or on the
# personal VPN. Names without a record fall back to normal resolution.
# Install: link into ~/.ssh/config.d/ and put `Include config.d/*` first in ~/.ssh/config.
CanonicalizeHostname yes
CanonicalDomains hosts.jesseearle.com
CanonicalizeMaxDots 0

# The VPS: root, with each machine's own root key (not the shared lab key).
Host jesseearle.hosts.jesseearle.com
  User root
  IdentityFile ~/.ssh/jesseearle
  IdentitiesOnly yes

Host acer-predator.hosts.jesseearle.com
  User earle

Host *.hosts.jesseearle.com
  User jearle
  IdentityFile ~/.ssh/lab
  IdentitiesOnly yes
  StrictHostKeyChecking accept-new
  ConnectTimeout 8
